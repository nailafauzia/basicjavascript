<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Suhu</title>
    <style>
        body { font-family: 'Georgia', 'Times New Roman', serif; background-color: #2c2c2c; display: flex; flex-direction: column; align-items: center; padding-top: 50px; margin: 0; }
        .card { background-color: #dfaa20; padding: 30px; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.4); width: 350px; }
        h2 { text-align: center; margin-top: 0; color: #1a1a1a; letter-spacing: 1px; font-size: 26px; }
        label { font-weight: bold; color: #1a1a1a; }
        input, select, button { width: 100%; padding: 12px; margin: 10px 0 15px 0; border: none; border-radius: 6px; box-sizing: border-box; font-family: 'Georgia', 'Times New Roman', serif; font-size: 15px; }
        input:focus, select:focus { outline: 2px solid #4a3320; }
        button { background-color: #4a3320; color: white; font-weight: bold; cursor: pointer; transition: 0.3s; letter-spacing: 0.5px; }
        button:hover { background-color: #2e1f13; }
        .pesan { text-align: center; font-weight: bold; margin-top: 10px; }
        .logout-btn { background-color: transparent; color: #4a3320; border: 2px solid #4a3320; margin-top: 10px; }
        .logout-btn:hover { background-color: #4a3320; color: white; }
        #hasilAngka { text-align: center; color: #4a3320; font-size: 24px; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Kalkulator Suhu</h2>
        <form id="formKonversi">
            <label>Suhu Awal:</label>
            <input type="number" id="nilaiSuhu" placeholder="Contoh: 12" required>
            
            <label>Dari Unit:</label>
            <select id="unitAsal">
                <option value="C">Celcius (C)</option>
                <option value="F">Fahrenheit (F)</option>
                <option value="R">Reamur (R)</option>
                <option value="K">Kelvin (K)</option>
            </select>

            <label>Ke Unit:</label>
            <select id="unitTujuan">
                <option value="F">Fahrenheit (F)</option>
                <option value="C">Celcius (C)</option>
                <option value="R">Reamur (R)</option>
                <option value="K">Kelvin (K)</option>
            </select>

            <button type="submit">Konversi Sekarang!</button>
        </form>
        <p class="pesan" id="pesanKonversi"></p>
        <h3 id="hasilAngka"></h3>
        
        <button class="logout-btn" id="btnLogout">Keluar (Logout)</button>
    </div>

    <script>
        // PENJAGA GERBANG FRONTEND: Cek token saat halaman dimuat
        const token = localStorage.getItem('rahasia_token_jwt');
        if (!token) {
            alert("Akses ditolak! Anda harus login terlebih dahulu.");
            window.location.href = '/login'; // Lempar kembali ke form login
        }

        // Logika Konversi Suhu
        document.getElementById('formKonversi').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const nilai = document.getElementById('nilaiSuhu').value;
            const dari = document.getElementById('unitAsal').value;
            const ke = document.getElementById('unitTujuan').value;
            const pesan = document.getElementById('pesanKonversi');
            const hasil = document.getElementById('hasilAngka');

            pesan.innerText = "Menghitung...";
            hasil.innerText = "";

            try {
                const response = await fetch('/api/convert-suhu', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token 
                    },
                    body: JSON.stringify({ value: nilai, from: dari, to: ke })
                });

                const data = await response.json();

                if (data.status === "success") {
                    pesan.innerText = data.message; 
                    pesan.style.color = "green";
                    hasil.innerText = `${data.data.input.value}°${data.data.input.unit} = ${data.data.result.value}°${data.data.result.unit}`;
                } else {
                    pesan.innerText = "Sesi habis/Error: " + data.message;
                    pesan.style.color = "red";
                    // Jika token invalid/expired, paksa logout
                    setTimeout(() => { document.getElementById('btnLogout').click(); }, 2000);
                }
            } catch (err) {
                pesan.innerText = "Server bermasalah.";
                pesan.style.color = "red";
            }
        });

        // Logika Logout
        document.getElementById('btnLogout').addEventListener('click', () => {
            localStorage.removeItem('rahasia_token_jwt');
            window.location.href = '/login'; // Pindah halaman ke login
        });
    </script>
</body>
</html>
