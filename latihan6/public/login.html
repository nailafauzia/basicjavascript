<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Aplikasi Suhu</title>
    <style>
        body { font-family: 'Georgia', 'Times New Roman', serif; background-color: #2c2c2c; display: flex; flex-direction: column; align-items: center; padding-top: 100px; margin: 0; }
        .card { background-color: #dfaa20; padding: 30px; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.4); width: 350px; }
        h2 { text-align: center; margin-top: 0; color: #1a1a1a; letter-spacing: 1px; font-size: 26px; }
        input, button { width: 100%; padding: 12px; margin: 10px 0 15px 0; border: none; border-radius: 6px; box-sizing: border-box; font-family: 'Georgia', 'Times New Roman', serif; font-size: 15px; }
        input:focus { outline: 2px solid #4a3320; }
        button { background-color: #4a3320; color: white; font-weight: bold; cursor: pointer; transition: 0.3s; letter-spacing: 0.5px; }
        button:hover { background-color: #2e1f13; }
        .pesan { text-align: center; font-weight: bold; margin-top: 10px; }
        .show-password-container { display: flex; align-items: center; margin-bottom: 15px; margin-top: -5px; }
        .show-password-container input[type="checkbox"] { width: auto; margin: 0 8px 0 0; cursor: pointer; }
        .show-password-container label { font-size: 14px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Login</h2>
        <form id="formLogin">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            
            <div class="show-password-container">
                <input type="checkbox" id="showPassword">
                <label for="showPassword">Tampilkan Password</label>
            </div>

            <button type="submit">Masuk</button>
        </form>
        <p class="pesan" id="pesanLogin"></p>
    </div>

    <script>
        // Logika Show Password
        document.getElementById('showPassword').addEventListener('change', function() {
            document.getElementById('password').type = this.checked ? 'text' : 'password';
        });

        // Logika Login Fetch
        document.getElementById('formLogin').addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            const pesan = document.getElementById('pesanLogin');

            pesan.innerText = "Mengecek kredensial...";
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: user, password: pass })
                });
                
                const data = await response.json();

                if (data.status === "success") {
                    // Simpan token
                    localStorage.setItem('rahasia_token_jwt', data.token);
                    
                    pesan.innerText = "Berhasil! Mengalihkan...";
                    pesan.style.color = "green";
                    
                    // JURUS PINDAH HALAMAN
                    setTimeout(() => {
                        window.location.href = '/konversi-suhu';
                    }, 1000); // Jeda 1 detik biar estetik
                    
                } else {
                    pesan.innerText = data.message;
                    pesan.style.color = "red";
                }
            } catch (err) {
                pesan.innerText = "Server bermasalah.";
                pesan.style.color = "red";
            }
        });
    </script>
</body>
</html>
