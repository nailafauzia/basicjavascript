<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Buku</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    body { background-color: #2e1025; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .container { background-color: #f472b6; width: 100%; max-width: 400px; padding: 40px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    h2 { text-align: center; color: #111; margin-top: 0; margin-bottom: 25px; font-size: 24px; }
    .form-group { margin-bottom: 15px; }
    .form-group input, .form-group select { width: 100%; padding: 12px; border: none; border-radius: 8px; box-sizing: border-box; outline: none; font-size: 14px; }
    .btn-submit { width: 100%; padding: 12px; background-color: #4a044e; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 15px; margin-top: 10px; transition: 0.2s; }
    .btn-submit:hover { background-color: #701a75; }
    .btn-kembali { display: block; text-align: center; margin-top: 15px; color: #111; text-decoration: none; font-weight: bold; font-size: 14px; }
    .btn-kembali:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Edit Buku</h2>
    <form id="formEdit">
      <div class="form-group"><input type="text" id="inputJudul" placeholder="Judul Buku" required></div>
      <div class="form-group"><input type="text" id="inputPenulis" placeholder="Nama Penulis" required></div>
      <div class="form-group">
        <select id="selectGenre" required>
          <option value="">Memuat Kategori...</option>
        </select>
      </div>
      <div class="form-group"><input type="number" id="inputTahun" placeholder="Tahun Terbit" required></div>
      
      <!-- TAMBAHAN PILIHAN STATUS (Tersedia / Dipinjam) -->
      <div class="form-group">
        <select id="selectStatus" required>
          <option value="true">Tersedia</option>
          <option value="false">Dipinjam</option>
        </select>
      </div>

      <button type="submit" class="btn-submit">Simpan Perubahan</button>
      <a href="dashboard.html" class="btn-kembali">Batal & Kembali</a>
    </form>
  </div>

  <script>
    $(document).ready(function() {
      const token = localStorage.getItem('jwt_token');
      if (!token) return window.location.href = 'login.html';

      // --- TAMBAHKAN PENGECEKAN KEAMANAN INI ---
      $.ajax({
        url: 'http://localhost:3000/api/me',
        type: 'GET',
        headers: { 'Authorization': `Bearer ${token}` },
        success: function() {
          // Jika token valid, jalankan pemuatan kategori dan data buku
          muatHalaman();
        },
        error: function() {
          // Jika token salah/ngawur (seperti 'asd'), hapus lalu tendang ke login!
          localStorage.removeItem('jwt_token');
          window.location.href = 'login.html';
        }
      });


      // Ambil ID buku dari URL (contoh: edit.html?id=1)
      const urlParams = new URLSearchParams(window.location.search);
      const bookId = urlParams.get('id');

      if (!bookId) {
        alert('ID Buku tidak valid!');
        window.location.href = 'dashboard.html';
        return;
      }

      // 1. Load Kategori ke Dropdown dulu, baru load data bukunya
      $.get('http://localhost:3000/api/categories', function(categories) {
        $('#selectGenre').empty().append('<option value="">Pilih Kategori Genre...</option>');
        categories.forEach(cat => {
          $('#selectGenre').append(`<option value="${cat.id}">${cat.name}</option>`);
        });

        // 2. Ambil data buku yang mau diedit
        $.ajax({
          url: `http://localhost:3000/api/books/${bookId}`,
          type: 'GET',
          headers: { 'Authorization': `Bearer ${token}` },
          success: function(book) {
            $('#inputJudul').val(book.title);
            $('#inputPenulis').val(book.authorName);
            $('#selectGenre').val(book.categoryId);
            $('#inputTahun').val(book.year);
            $('#selectStatus').val(book.available.toString());
          },
          error: function() {
            alert('Gagal memuat data buku.');
            window.location.href = 'dashboard.html';
          }
        });
      });

      // 3. Kirim perubahan data saat form disubmit
      $('#formEdit').submit(function(e) {
        e.preventDefault();
        const payload = {
          title: $('#inputJudul').val(),
          authorName: $('#inputPenulis').val(),
          categoryId: $('#selectGenre').val(),
          year: $('#inputTahun').val(),
          available: $('#selectStatus').val() === 'true'
        };

        $.ajax({
          url: `http://localhost:3000/api/books/${bookId}`,
          type: 'PUT',
          contentType: 'application/json',
          headers: { 'Authorization': `Bearer ${token}` },
          data: JSON.stringify(payload),
          success: function() {
            window.location.href = 'dashboard.html';
          },
          error: function() {
            alert('Gagal mengupdate buku.');
          }
        });
      });
    });
  </script>
</body>
</html>
